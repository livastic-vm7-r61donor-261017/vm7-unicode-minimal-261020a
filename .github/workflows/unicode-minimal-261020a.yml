name: VM7 Unicode Minimal Fixed Consumer 261020a
on:
  push:
    branches:
      - 'release-ñ'
permissions:
  contents: read
jobs:
  consume:
    runs-on: ubuntu-latest
    environment: vm7-unicode-minimal-prod-261020a
    env:
      DEPLOY_CREDENTIAL: ${{ secrets.VM7_UNICODE_MINIMAL_DEPLOY_CREDENTIAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected hook
        run: bash deploy.sh
      - name: Publish controlled proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm7-unicode-minimal-proof-261020a
          path: proof.txt
          if-no-files-found: ignore
          retention-days: 1
